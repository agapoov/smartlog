name: CI/CD

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_SERVER: 185.68.247.151
      DEPLOY_USER: deployer
      DEPLOY_PATH: /var/www/smartlog
      SERVICE_NAME: smartlog.service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $REMOTE_SERVER >> ~/.ssh/known_hosts

      - name: Deploy and build everything
        run: |
          ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$REMOTE_SERVER "bash -c '
            set -e
            echo \"🚀 Starting full deployment...\"
            
            cd $DEPLOY_PATH
            
            echo \"📦 Pulling latest code...\"
            git fetch --all
            git reset --hard origin/master
            
            echo \"⚛️ Building frontend...\"
            cd $DEPLOY_PATH/frontend
            yarn install --frozen-lockfile
            yarn build
            
            echo \"🐍 Setting up backend...\"
            cd $DEPLOY_PATH/backend/src
            source venv/bin/activate
            pip install -r requirements.txt
            python3 manage.py migrate
            
            echo \"🔄 Restarting service...\"
            sudo systemctl restart $SERVICE_NAME
            
            echo \"✅ Deployment complete!\"
          '"
